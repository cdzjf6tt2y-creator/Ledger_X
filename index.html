  <style>
    :root {
      --bg: #f6f3ee;
      --surface: #fcfbf8;
      --surface2: #efece6;
      --border: #e0dbd3;
      --fg: #2a2622;
      --muted: #5c564e;
      --good: #1d6b45;
      --bad: #a33d34;
      --warn: #8a6230;
      --soft: #efece6;
    }
    [data-theme="dark"] {
      --bg: #141311;
      --surface: #1c1b18;
      --surface2: #26241f;
      --border: #38352e;
      --fg: #f4f1ea;
      --muted: #c8c2b6;
      --good: #8dccaa;
      --bad: #e7a39b;
      --warn: #e0c08a;
      --soft: #26241f;
    }
    * { box-sizing: border-box; margin: 0; padding: 0; }
    html, body { height: auto; min-height: 100%; overflow-x: hidden; overflow-y: auto; -webkit-overflow-scrolling: touch; }
    body {
      font-family: "Nunito Sans", "Segoe UI", sans-serif;
      background: var(--bg);
      color: var(--fg);
      min-height: 100vh;
      min-height: 100dvh;
      font-size: 17px;
      line-height: 1.55;
      -webkit-font-smoothing: antialiased;
    }
    .app { max-width: 440px; margin: 0 auto; padding: calc(0.9rem + env(safe-area-inset-top, 0px)) 1.2rem calc(9.5rem + env(safe-area-inset-bottom, 0px)); }
    .top { display: flex; justify-content: space-between; align-items: flex-start; gap: 0.8rem; margin-bottom: 0.85rem; }
    h1 { font-size: 2rem; font-weight: 650; letter-spacing: -0.02em; line-height: 1.15; }
    .sub { color: var(--muted); font-size: 0.98rem; margin-top: 0.25rem; max-width: 16rem; }
    .kicker { font-size: 0.95rem; color: var(--muted); }
    .actions { display: flex; gap: 0.4rem; }
    button { font-family: inherit; cursor: pointer; border: none; background: transparent; color: inherit; }
    .pill { height: 40px; padding: 0 0.95rem; border-radius: 999px; font-size: 0.95rem; font-weight: 600; border: 1px solid var(--border); background: var(--surface); }
    .pill.solid { background: var(--fg); color: var(--bg); border-color: var(--fg); }
    .hero { background: var(--surface); border: 1px solid var(--border); border-radius: 1.5rem; padding: 1.35rem; margin-bottom: 1.4rem; }
    .label { font-size: 0.95rem; color: var(--muted); }
    .net { font-size: 2.7rem; font-weight: 650; letter-spacing: -0.03em; line-height: 1.1; margin: 0.25rem 0 0.3rem; font-variant-numeric: tabular-nums; }
    .net.neg { color: var(--bad); }
    .meta-line { font-size: 0.95rem; color: var(--muted); }
    .grid2 { display: grid; grid-template-columns: 1fr 1fr; gap: 0.6rem; margin-top: 1rem; }
    .mini { background: var(--surface2); border-radius: 1rem; padding: 0.8rem 0.9rem; }
    .mini .l { font-size: 0.88rem; color: var(--muted); }
    .mini .v { font-size: 1.15rem; font-weight: 650; margin-top: 0.15rem; font-variant-numeric: tabular-nums; }
    .good { color: var(--good); } .bad { color: var(--bad); } .warn { color: var(--warn); }
    .section { margin-bottom: 1.5rem; }
    .section-head { display: flex; justify-content: space-between; align-items: center; margin-bottom: 0.65rem; }
    .section h2 { font-size: 1.28rem; font-weight: 650; }
    .card { background: var(--surface); border: 1px solid var(--border); border-radius: 1.25rem; padding: 1rem; }
    .item { display: flex; justify-content: space-between; align-items: center; gap: 0.7rem; padding: 0.75rem 0; border-bottom: 1px solid var(--border); }
    .item:last-child { border-bottom: none; }
    .name { font-weight: 650; }
    .meta { font-size: 0.92rem; color: var(--muted); margin-top: 0.1rem; }
    .empty { text-align: center; color: var(--muted); padding: 1.1rem 0.4rem; }
    .tabs { display: flex; background: var(--surface2); border-radius: 999px; padding: 0.2rem; margin-bottom: 1rem; }
    .tab { flex: 1; text-align: center; padding: 0.5rem 0.2rem; border-radius: 999px; font-size: 0.9rem; font-weight: 650; color: var(--muted); }
    .tab.on { background: var(--fg); color: var(--bg); }
    .bottom { position: fixed; left: 0; right: 0; bottom: 0; z-index: 30; background: var(--bg); border-top: 1px solid var(--border); padding: 0.3rem 0.4rem calc(0.45rem + env(safe-area-inset-bottom, 0px)); }
    .bottom-inner { max-width: 440px; margin: 0 auto; display: flex; }
    .bottom button { flex: 1; min-height: 48px; font-size: 0.78rem; font-weight: 700; color: var(--muted); border-radius: 0.7rem; }
    .bottom button.on { color: var(--fg); }
    input, select { width: 100%; max-width: 100%; min-width: 0; background: var(--surface2); border: 1px solid var(--border); color: var(--fg); padding: 0.7rem 0.8rem; border-radius: 0.75rem; font-size: 16px; font-family: inherit; margin-top: 0.2rem; }
    input[type="datetime-local"] { display: block; width: 100%; max-width: 100%; min-width: 0; overflow: hidden; text-align: left; }
    input[type="datetime-local"]::-webkit-date-and-time-value { text-align: left; min-width: 0; }
    label { display: block; font-size: 0.92rem; color: var(--muted); margin-top: 0.7rem; }
    .modal { position: fixed; inset: 0; background: rgba(0,0,0,0.5); display: flex; align-items: flex-end; justify-content: center; z-index: 50; padding: 0; overflow: hidden; }
    .modal-box { background: var(--surface); border-radius: 1.25rem 1.25rem 0 0; padding: 1.15rem 1.15rem calc(1.15rem + env(safe-area-inset-bottom, 0px)); width: 100%; max-width: 440px; max-height: 86vh; overflow-x: hidden; overflow-y: auto; min-width: 0; }
    .progress { height: 6px; background: var(--surface2); border-radius: 99px; overflow: hidden; margin-top: 0.35rem; }
    .progress > div { height: 100%; background: var(--fg); }
    .chart-box { position: relative; height: 180px; margin-top: 0.35rem; touch-action: pan-y; }
    .chart-box canvas { touch-action: pan-y !important; pointer-events: none; }
    .link { color: var(--muted); font-size: 0.92rem; text-decoration: none; font-weight: 650; }
    .danger { color: var(--bad); }
    .acts { display: flex; align-items: center; gap: 1.5rem; margin-top: 0.55rem; }
    .acts .link { min-height: 44px; padding: 0.55rem 0.2rem; }
    .acts .danger { margin-left: auto; }
    .notice { display: none; margin-bottom: 1rem; padding: 0.7rem 0.9rem; background: var(--surface2); border-radius: 0.7rem; color: var(--warn); }
    .settled { opacity: 0.55; }
    .side { display: none; }
    .layout-row { margin-bottom: 1.4rem; }
    .layout-switch { display: inline-flex; align-items: center; gap: 0.7rem; height: 44px; padding: 0 1rem; border-radius: 999px; border: 1px solid var(--border); background: var(--surface); font-size: 0.95rem; font-weight: 650; color: var(--muted); white-space: nowrap; }
    .layout-switch .lab-phone,
    .layout-switch .lab-mac { flex: none; line-height: 1; }
    .layout-switch[aria-pressed="false"] .lab-phone,
    .layout-switch[aria-pressed="true"] .lab-mac { color: var(--fg); }
    .knob-wrap { width: 48px; height: 28px; border-radius: 99px; background: var(--surface2); position: relative; flex: none; overflow: hidden; }
    .knob { position: absolute; top: 4px; left: 4px; width: 20px; height: 20px; border-radius: 50%; background: var(--fg); transition: transform 0.2s ease; }
    .layout-switch[aria-pressed="true"] .knob { transform: translateX(20px); }
    html[data-layout="desktop"] .shell { display: flex; min-height: 100vh; align-items: stretch; }
    html[data-layout="desktop"] .side { display: flex; flex-direction: column; gap: 0.2rem; width: 196px; flex-shrink: 0; padding: 1.4rem 0.75rem; border-right: 1px solid var(--border); background: var(--surface); position: sticky; top: 0; height: 100vh; }
    html[data-layout="desktop"] .side .brand { font-size: 1.35rem; font-weight: 700; padding: 0.2rem 0.7rem 1rem; }
    html[data-layout="desktop"] .side button { text-align: left; padding: 0.7rem 0.8rem; border-radius: 0.75rem; font-weight: 650; color: var(--muted); font-size: 1rem; }
    html[data-layout="desktop"] .side button.on { background: var(--surface2); color: var(--fg); }
    html[data-layout="desktop"] .app { max-width: 1080px; padding: 1.8rem 2rem 3rem; }
    html[data-layout="desktop"] .bottom { display: none; }
    html[data-layout="desktop"] .sub { max-width: 28rem; }
    html[data-layout="desktop"] #home { display: grid; grid-template-columns: 1.15fr 0.85fr; gap: 0.2rem 1.4rem; align-items: start; }
    html[data-layout="desktop"] #home .span2 { grid-column: 1 / -1; }
    html[data-layout="desktop"] .chart-box { height: 240px; }
    html[data-layout="desktop"] .modal { align-items: center; }
    html[data-layout="desktop"] .modal-box { border-radius: 1.25rem; max-width: 480px; }
    html[data-layout="desktop"] #charts { display: grid; grid-template-columns: 1fr 1fr; gap: 0.4rem 1.4rem; align-items: start; }
    html[data-layout="desktop"] #charts .section:first-child { grid-column: 1 / -1; }
  </style>
</head>
<body>
  <div class="shell">
  <aside class="side">

    <div class="top">
      <div>
        <p class="kicker" id="monthLabel"></p>

      <button data-tab="home" class="on">Home</button>
      <button data-tab="cash">Cash</button>

  <div id="modal" class="modal" style="display:none">
    <div class="modal-box">
      <h2 id="modalTitle" style="font-size:1.3rem;font-weight:700;margin-bottom:0.4rem"></h2>
      <div id="modalBody"></div>
      <div style="display:flex;justify-content:flex-end;gap:0.4rem;margin-top:1rem">
        <button class="pill" id="modalCancel">Cancel</button>
        <button class="pill solid" id="modalSave">Save</button>
      </div>

  </div>
  <div id="ask" class="modal" style="display:none">
    <div class="modal-box">
      <h2 id="askTitle" style="font-size:1.35rem;font-weight:700">Delete this?</h2>
      <p class="meta" style="margin-top:0.35rem">This cannot be undone.</p>
      <div class="acts" style="margin-top:1.2rem">
        <button class="pill" id="askNo" type="button">Keep</button>
        <button class="pill" id="askYes" type="button" style="margin-left:auto;background:var(--bad);color:#fff;border-color:var(--bad)">Delete</button>
      </div>
    </div>

<script>
const { jsPDF } = window.jspdf;
const KEY = "ledger_premium_v1";
const THEME_KEY = "ledger_theme";
const LAYOUT_KEY = "ledger_layout";
const CATS = ["Housing","Food","Transport","Utilities","Entertainment","Shopping","Health","Education","Travel","Subscriptions","Debt Payment","Other"];
const KINDS = [{id:"chequing",label:"Chequing"},{id:"savings",label:"Savings"},{id:"investment",label:"Investment"}];
let data = { income: [], expenses: [], budgets: {}, cards: [], accounts: [], goals: [], book: [] };
let theme = "dark";
let layout = "phone";
let tab = "home";
let cashView = "expenses";
let bookView = "all";
let charts = {};
let modalSave = null;

function uid(){ return Date.now().toString(36)+Math.random().toString(36).slice(2,6); }
function esc(s){
  return String(s ?? "").replace(/[&<>"']/g, function(c){
    if (c === "&") return "&" + "amp;";
    if (c === "<") return "&" + "lt;";
    if (c === ">") return "&" + "gt;";
    if (c === '"') return "&" + "quot;";
    return "&" + "#39;";
  });
}
function today(){ return new Date().toISOString().slice(0,10); }
function dayOf(s){ return String(s||"").slice(0,10); }
function nowLocal(){
  const d=new Date(), p=n=>String(n).padStart(2,"0");
  return `${d.getFullYear()}-${p(d.getMonth()+1)}-${p(d.getDate())}T${p(d.getHours())}:${p(d.getMinutes())}`;
}
function whenValue(s){
  if(s && String(s).includes("T")) return String(s).slice(0,16);
  if(s) return dayOf(s)+"T"+nowLocal().slice(11,16);
  return nowLocal();
}
function stamp(s){
  if(!s) return "";
  const day=dayOf(s);
  const d=new Date(day+"T12:00:00");
  if(Number.isNaN(d.getTime())) return "";
  const mon=["Jan","Feb","Mar","Apr","May","Jun","Jul","Aug","Sep","Oct","Nov","Dec"][d.getMonth()];
  const time=String(s).includes("T")?String(s).slice(11,16):"";
  return time?`${mon} ${d.getDate()} · ${time}`:`${mon} ${d.getDate()}`;
}
function monthKey(d){ const x=new Date(dayOf(d)+"T12:00:00"); return `${x.getFullYear()}-${String(x.getMonth()+1).padStart(2,"0")}`; }
function curMonth(){ const n=new Date(); return `${n.getFullYear()}-${String(n.getMonth()+1).padStart(2,"0")}`; }
function money(n){ return new Intl.NumberFormat("en-CA",{style:"currency",currency:"CAD"}).format(Number(n)||0); }
function interest(bal,apr){ return (bal*(apr/100))/12; }
function accrual(c){
  const balance=+c.balance||0, apr=+c.apr||0, todayStr=today();
  const asOf=(c.asOf&&/^\d{4}-\d{2}-\d{2}$/.test(c.asOf))?c.asOf:todayStr;
  const days=Math.max(0, Math.round((new Date(todayStr+"T12:00:00")-new Date(asOf+"T12:00:00"))/86400000));
  const daily=(balance*(apr/100))/365;
  return {asOf, days, daily, accrued:daily*days, owed:balance+daily*days};
}
function upsert(hist,date,bal){
  const day=dayOf(date);
  const at=String(date).includes("T")?String(date).slice(0,16):day+"T"+nowLocal().slice(11,16);
  const h=(hist||[]).filter(p=>dayOf(p.date)!==day);
  h.push({date:day,bal,at});
  h.sort((a,b)=>dayOf(a.date).localeCompare(dayOf(b.date)));
  return h;
}
function budgetOf(c){
  const v=(data.budgets||{})[c];
  if(v && typeof v==="object") return {limit:+v.limit||0, date:v.date||"", at:v.at||v.date||""};
  return {limit:+v||0, date:"", at:""};
}
function loggedOn(a){
  const h=[...(a.history||[])].sort((x,y)=>dayOf(y.date).localeCompare(dayOf(x.date)));
  return h[0]?.at||h[0]?.date||"";
}

function load(){
  try{
    const r=localStorage.getItem(KEY);
    if(r){
      const v=JSON.parse(r);
      if(Array.isArray(v.income)) data={...data,...v,accounts:v.accounts||[],goals:v.goals||[],book:Array.isArray(v.book)?v.book:[]};
    }
  }catch(e){}
  const todayStr=today();
  let stamped=false;
  data.cards=(data.cards||[]).map(c=>{ if(c.asOf) return c; stamped=true; return {...c, asOf:todayStr}; });
  data.book=(data.book||[]).map(b=>({...b, side:b.side==="me"?"me":"they", settled:!!b.settled}));
  if(stamped) localStorage.setItem(KEY, JSON.stringify(data));
  const t=localStorage.getItem(THEME_KEY); if(t==="dark"||t==="light") theme=t;
  const savedLayout=localStorage.getItem(LAYOUT_KEY);
  if(savedLayout==="desktop"||savedLayout==="phone") layout=savedLayout;
  else if(window.innerWidth>=1100) layout="desktop";
  applyTheme();
  applyLayout();
  document.getElementById("monthLabel").textContent = curMonth();
}
function applyTheme(){
  document.documentElement.dataset.theme = theme;
  document.getElementById("themeBtn").textContent = theme === "dark" ? "Light" : "Dark";
  localStorage.setItem(THEME_KEY, theme);
}
function applyLayout(){
  document.documentElement.dataset.layout = layout;
  const btn=document.getElementById("layoutBtn");
  if(btn) btn.setAttribute("aria-pressed", layout==="desktop" ? "true" : "false");
  localStorage.setItem(LAYOUT_KEY, layout);
}
function save(){ localStorage.setItem(KEY, JSON.stringify(data)); render(); }
function flash(msg){ const n=document.getElementById("notice"); n.textContent=msg; n.style.display="block"; setTimeout(()=>n.style.display="none",2200); }
function stats(){
  const m=curMonth();
  const inc=data.income.filter(i=>monthKey(i.date)===m).reduce((s,i)=>s+ +i.amount,0);
  const exp=data.expenses.filter(e=>monthKey(e.date)===m).reduce((s,e)=>s+ +e.amount,0);
  const assets=data.accounts.reduce((s,a)=>s+ +a.balance,0);
  const debt=data.cards.reduce((s,c)=>s+accrual(c).owed,0);
  const accrued=data.cards.reduce((s,c)=>s+accrual(c).accrued,0);
  const int=data.cards.reduce((s,c)=>s+interest(+c.balance,+c.apr),0);
  const by={}; data.expenses.filter(e=>monthKey(e.date)===m).forEach(e=>by[e.category]=(by[e.category]||0)+ +e.amount);
  return {inc,exp,assets,debt,int,accrued,by,left:inc-exp,net:assets-debt,leak:inc-exp-int};
}

function render(){
  const s=stats();
  document.querySelectorAll(".panel").forEach(p=>p.style.display="none");
  document.getElementById(tab).style.display="block";
  document.querySelectorAll("[data-tab]").forEach(b=>b.classList.toggle("on", b.dataset.tab===tab));
  if(tab==="home") renderHome(s);
  if(tab==="cash") renderCash();
  if(tab==="banks") renderBanks();
  if(tab==="cards") renderCards();
  if(tab==="book") renderBook();
  if(tab==="charts") renderCharts();
}

function renderHome(s){
  const monthRows=[...data.income.map(i=>({...i,k:"in"})),...data.expenses.map(e=>({...e,k:"out"}))].filter(r=>monthKey(r.date)===curMonth()).sort((a,b)=>b.date.localeCompare(a.date));
  const budgetCats=Object.keys(data.budgets||{});
  document.getElementById("home").innerHTML=`
    <div class="hero span2">
      <div class="label">Net worth</div>
      <div class="net ${s.net<0?"neg":""}">${money(s.net)}</div>
      <p class="meta-line">${money(s.assets)} in banks · ${money(s.debt)} owed on cards</p>
      <div class="grid2">
        <div class="mini"><div class="l">Income</div><div class="v good">${money(s.inc)}</div></div>
        <div class="mini"><div class="l">Spent</div><div class="v bad">${money(s.exp)}</div></div>
        <div class="mini"><div class="l">Interest / month</div><div class="v ${s.int>0?"bad":""}">${money(s.int)}</div></div>

  const now=new Date();
  for(let i=5;i>=0;i--){
    const d=new Date(now.getFullYear(), now.getMonth()-i, 1);
    const key=`${d.getFullYear()}-${String(d.getMonth()+1).padStart(2,"0")}`;
    rows.push({
      name:d.toLocaleString("en-CA",{month:"short"}),
      Income:data.income.filter(x=>monthKey(x.date)===key).reduce((s,x)=>s+ +x.amount,0),
      Spent:data.expenses.filter(x=>monthKey(x.date)===key).reduce((s,x)=>s+ +x.amount,0)
    });
  }
  return rows;
}
function netSeries(){
  const dates=new Set();
  data.accounts.forEach(a=>(a.history||[]).forEach(p=>dates.add(p.date)));
  const debt=data.cards.reduce((s,c)=>s+accrual(c).owed,0);
  return [...dates].sort().map(d=>{
    let assets=0;
    data.accounts.forEach(a=>{
      const prior=[...(a.history||[])].filter(p=>p.date<=d).at(-1);
      if(prior) assets+= +prior.bal;
    });
    return {date:d.slice(5), net:Math.round(assets-debt)};
  });
}
function drawNet(id){
  const ctx=document.getElementById(id); if(!ctx) return;
  if(charts[id]) charts[id].destroy();
  const series=netSeries();
  if(!series.length){ ctx.parentElement.innerHTML=`<div class="empty">Log an account balance to see this.</div>`; return; }
  const accent = theme==="dark" ? "#f4f1ea" : "#2a2622";
  charts[id]=new Chart(ctx,{type:"line",data:{labels:series.map(s=>s.date),datasets:[{data:series.map(s=>s.net),borderColor:accent,backgroundColor:"transparent",tension:0.35,pointRadius:0,borderWidth:2}]},options:{responsive:true,maintainAspectRatio:false,events:["click","mousemove","mouseout"],plugins:{legend:{display:false}},scales:{x:{grid:{display:false},ticks:{color:"#8a847a",font:{family:"Nunito Sans",size:11}}},y:{grid:{color:theme==="dark"?"rgba(255,255,255,0.06)":"rgba(0,0,0,0.06)"},ticks:{color:"#8a847a",font:{family:"Nunito Sans",size:11}}}}}});
}
function drawMonth(id){
  const ctx=document.getElementById(id); if(!ctx) return;
  if(charts[id]) charts[id].destroy();
  const rows=monthSeries();
  const good = theme==="dark" ? "#8dccaa" : "#1d6b45";
  const bad = theme==="dark" ? "#e7a39b" : "#a33d34";
  const grid = theme==="dark" ? "#38352e" : "#e0dbd3";
  charts[id]=new Chart(ctx,{type:"bar",data:{labels:rows.map(r=>r.name),datasets:[{label:"Income",data:rows.map(r=>r.Income),backgroundColor:good,borderRadius:6},{label:"Spent",data:rows.map(r=>r.Spent),backgroundColor:bad,borderRadius:6}]},options:{responsive:true,maintainAspectRatio:false,events:["click","mousemove","mouseout"],plugins:{legend:{position:"bottom",labels:{color:"#8a847a",font:{family:"Nunito Sans",size:12}}}},scales:{x:{grid:{display:false},ticks:{color:"#8a847a",font:{family:"Nunito Sans",size:11}}},y:{grid:{color:grid},ticks:{color:"#8a847a",font:{family:"Nunito Sans",size:11}}}}}});
}
function drawCat(){
  const ctx=document.getElementById("catChart"); if(!ctx) return;
  if(charts.catChart) charts.catChart.destroy();
  const s=stats(); const labels=Object.keys(s.by); const vals=Object.values(s.by);
  if(!labels.length){ ctx.parentElement.innerHTML=`<div class="empty">No spending this month.</div>`; return; }
  charts.catChart=new Chart(ctx,{type:"bar",data:{labels,datasets:[{data:vals,backgroundColor:theme==="dark"?"#e7a39b":"#a33d34",borderRadius:6}]},options:{indexAxis:"y",responsive:true,maintainAspectRatio:false,events:["click","mousemove","mouseout"],plugins:{legend:{display:false}},scales:{x:{grid:{color:theme==="dark"?"rgba(255,255,255,0.06)":"rgba(0,0,0,0.06)"},ticks:{color:"#8a847a",font:{family:"Nunito Sans",size:11}}},y:{grid:{display:false},ticks:{color:"#8a847a",font:{family:"Nunito Sans",size:11}}}}}});
}

document.getElementById("themeBtn").onclick=()=>{ theme = theme === "dark" ? "light" : "dark"; applyTheme(); render(); };
document.getElementById("layoutBtn").onclick=()=>{ layout = layout === "desktop" ? "phone" : "desktop"; applyLayout(); render(); };
document.getElementById("backupBtn").onclick=()=>{
  const blob=new Blob([JSON.stringify(data,null,2)],{type:"application/json"});
  const a=document.createElement("a"); a.href=URL.createObjectURL(blob); a.download=`ledger-backup-${today()}.json`; a.click();
};
document.getElementById("importBtn").onclick=()=>document.getElementById("importFile").click();
document.getElementById("importFile").onchange=(e)=>{
  const f=e.target.files&&e.target.files[0]; if(!f) return;
  const r=new FileReader();
  r.onload=()=>{
    try{
      const v=JSON.parse(r.result);
      if(!Array.isArray(v.income)) throw 0;
      if(!confirm("Replace everything?")) return;
      data={...data,...v,accounts:v.accounts||[],goals:v.goals||[],book:Array.isArray(v.book)?v.book:[]};
      save(); flash("Imported.");
    }catch{ flash("Invalid file."); }
  };
  r.readAsText(f); e.target.value="";
};
document.getElementById("pdfBtn").onclick=()=>{
  const doc=new jsPDF({unit:"mm",format:"a4"});
  const s=stats();
  const W=210, H=297, M=14;
  const ink=[28,25,22], mute=[122,116,108], linec=[226,220,210], good=[29,107,69], bad=[163,61,52];
  const cash=n=>{ const v=Number(n)||0; const abs=Math.abs(v).toLocaleString("en-CA",{minimumFractionDigits:2,maximumFractionDigits:2}); return (v<0?"-":"")+"$"+abs; };
  let y=0, page=1;
  function ground(){ doc.setFillColor(246,243,238); doc.rect(0,0,W,H,"F"); }
  function foot(){
    doc.setFont("helvetica","normal"); doc.setFontSize(8); doc.setTextColor(mute[0],mute[1],mute[2]);
    doc.text("Ledger   ·   on this phone only   ·   card interest is balance × APR / 365", M, H-8);
    doc.text(String(page), W-M, H-8, {align:"right"});
  }
  function need(h){
    if(y+h<=H-16) return;
    foot(); doc.addPage(); page++; ground();
    doc.setFont("helvetica","bold"); doc.setFontSize(9); doc.setTextColor(ink[0],ink[1],ink[2]);
    doc.text("Ledger", M, 12);
    doc.setFont("helvetica","normal"); doc.setTextColor(mute[0],mute[1],mute[2]);
    doc.text(curMonth(), W-M, 12, {align:"right"});
    y=18;
  }
  function heading(title){
    need(12);
    doc.setFont("helvetica","bold"); doc.setFontSize(13); doc.setTextColor(ink[0],ink[1],ink[2]);
    doc.text(title, M, y+4);
    y+=7;
    doc.setDrawColor(linec[0],linec[1],linec[2]); doc.setLineWidth(0.25); doc.line(M, y, W-M, y);
    y+=4;
  }
  function cells(cols, shade){
    need(7);
    if(shade){ doc.setFillColor(252,250,246); doc.rect(M, y-4.4, W-M*2, 7, "F"); }
    let x=M;
    cols.forEach(c=>{
      doc.setFont("helvetica", c.b?"bold":"normal");
      doc.setFontSize(c.s||9);
      const col=c.c||ink;
      doc.setTextColor(col[0],col[1],col[2]);
      const t=doc.splitTextToSize(String(c.t??""), c.w-2)[0]||"";
      doc.text(t, c.a==="r"?x+c.w-1:x, y, {align:c.a==="r"?"right":"left"});
      x+=c.w;
    });
    y+=6.6;
  }
  function none(msg){ cells([{t:msg,w:W-M*2,c:mute}], false); }
  const inner=W-M*2;
  ground();
  doc.setFillColor(28,25,22); doc.rect(0,0,W,34,"F");
  doc.setTextColor(246,243,238); doc.setFont("helvetica","bold"); doc.setFontSize(22); doc.text("Ledger", M, 16);
  doc.setFont("helvetica","normal"); doc.setFontSize(9); doc.setTextColor(206,200,190);
  doc.text(curMonth()+"     "+stamp(nowLocal()), M, 24);
  y=44;
  doc.setFillColor(255,253,250); doc.setDrawColor(linec[0],linec[1],linec[2]);
  doc.roundedRect(M, y, inner, 30, 3, 3, "FD");
  doc.setFontSize(8); doc.setTextColor(mute[0],mute[1],mute[2]); doc.text("NET WORTH", M+6, y+8);
  doc.setFont("helvetica","bold"); doc.setFontSize(22); doc.setTextColor(...(s.net<0?bad:ink));
  doc.text(cash(s.net), M+6, y+19);
  doc.setFont("helvetica","normal"); doc.setFontSize(9); doc.setTextColor(mute[0],mute[1],mute[2]);
  doc.text(cash(s.assets)+" in banks      "+cash(s.debt)+" owed on cards", M+6, y+26);
  y+=36;
  const tiles=[["Income",cash(s.inc),good],["Spent",cash(s.exp),bad],["Ahead",cash(s.left),s.left<0?bad:good],["Interest / mo",cash(s.int),ink]];
  const tw=(inner-6)/4;
  tiles.forEach((t,i)=>{
    const x=M+i*(tw+2);
    doc.setFillColor(255,253,250); doc.roundedRect(x, y, tw, 18, 2, 2, "FD");
    doc.setFont("helvetica","normal"); doc.setFontSize(7); doc.setTextColor(mute[0],mute[1],mute[2]);
    doc.text(String(t[0]).toUpperCase(), x+3, y+6);
    doc.setFont("helvetica","bold"); doc.setFontSize(10); doc.setTextColor(t[2][0],t[2][1],t[2][2]);
    doc.text(String(t[1]), x+3, y+13);
  });
  y+=26;
  heading("Six months");
  cells([{t:"Month",w:40,c:mute,s:8},{t:"Income",w:50,a:"r",c:mute,s:8},{t:"Spent",w:50,a:"r",c:mute,s:8},{t:"Left",w:inner-140,a:"r",c:mute,s:8}]);
  monthSeries().forEach((r,i)=>{
    const left=r.Income-r.Spent;
    cells([{t:r.name,w:40},{t:cash(r.Income),w:50,a:"r",c:good},{t:cash(r.Spent),w:50,a:"r",c:bad},{t:cash(left),w:inner-140,a:"r",c:left<0?bad:good,b:1}], i%2===0);
  });
  y+=3;
  heading("Banks");
  if(!data.accounts.length) none("None yet.");
  data.accounts.forEach(a=>{
    const kind=KINDS.find(k=>k.id===a.kind)?.label||a.kind;
    cells([{t:a.name,w:70,b:1},{t:kind,w:40,c:mute},{t:stamp(loggedOn(a)),w:46,c:mute},{t:cash(a.balance),w:inner-156,a:"r",b:1}]);
    [...(a.history||[])].sort((p,q)=>dayOf(p.date).localeCompare(dayOf(q.date))).forEach(p=>{
      cells([{t:"",w:8},{t:stamp(p.at||p.date),w:50,c:mute,s:8},{t:cash(p.bal),w:40,c:mute,s:8}]);
    });
  });
  y+=3;
  heading("Cards");
  if(!data.cards.length) none("None yet.");
  data.cards.forEach(c=>{
    const a=accrual(c);
    const name=c.name+(c.last4?"  ···· "+c.last4:"");
    cells([{t:name,w:78,b:1},{t:c.apr+"% APR",w:28,c:mute},{t:stamp(c.at||a.asOf),w:40,c:mute},{t:cash(a.owed),w:inner-146,a:"r",c:bad,b:1}]);
    cells([{t:"Statement "+cash(c.balance)+"    +"+cash(a.accrued)+"    "+cash(a.daily)+"/day",w:inner,c:mute,s:8}]);
  });
  y+=3;
  heading("Goals");
  if(!data.goals.length) none("None yet.");
  data.goals.forEach(g=>{
    const pct=g.target>0?Math.min(100,(+g.saved/+g.target)*100):0;
    cells([{t:g.name,w:80,b:1},{t:stamp(g.at||g.date),w:46,c:mute},{t:cash(g.saved)+" / "+cash(g.target),w:inner-126,a:"r"}]);
    need(5);
    doc.setFillColor(232,228,220); doc.roundedRect(M, y-2, inner, 2.2, 1, 1, "F");
    doc.setFillColor(28,25,22); doc.roundedRect(M, y-2, Math.max(1.5, inner*pct/100), 2.2, 1, 1, "F");
    y+=4;
    if(g.note) cells([{t:g.note,w:inner,c:mute,s:8}]);
  });
  y+=3;
  heading("Budgets");
  const bcats=Object.keys(data.budgets||{});
  if(!bcats.length) none("None yet.");
  bcats.forEach((c,i)=>{
    const b=budgetOf(c); const spent=s.by[c]||0;
    cells([{t:c,w:55,b:1},{t:stamp(b.at||b.date),w:42,c:mute},{t:cash(spent)+" / "+cash(b.limit),w:inner-97,a:"r",c:b.limit>0&&spent>b.limit?bad:ink}], i%2===0);
  });
  y+=3;
  heading("Income");
  const inc=[...data.income].sort((a,b)=>String(b.at||b.date).localeCompare(String(a.at||a.date)));
  if(!inc.length) none("None yet.");
  inc.forEach((r,i)=>cells([{t:stamp(r.at||r.date),w:42,c:mute},{t:r.description||"Income",w:inner-78},{t:cash(r.amount),w:36,a:"r",c:good,b:1}], i%2===0));
  y+=3;
  heading("Spending");
  const exp=[...data.expenses].sort((a,b)=>String(b.at||b.date).localeCompare(String(a.at||a.date)));
  if(!exp.length) none("None yet.");
  exp.forEach((r,i)=>cells([{t:stamp(r.at||r.date),w:42,c:mute},{t:r.description||r.category,w:inner-110},{t:r.category,w:32,c:mute},{t:cash(r.amount),w:36,a:"r",c:bad,b:1}], i%2===0));
  y+=3;
  heading("Book");
  const book=[...(data.book||[])].sort((a,b)=>String(b.at||b.date).localeCompare(String(a.at||a.date)));
  if(!book.length) none("None yet.");
  book.forEach((b,i)=>{
    const side=b.side==="they"?"Owes you":"You owe";
    cells([{t:stamp(b.at||b.date),w:42,c:mute},{t:b.name+(b.settled?"  ·  settled":""),w:58,c:b.settled?mute:ink},{t:side,w:32,c:mute},{t:cash(b.amount),w:inner-132,a:"r",c:b.side==="they"?good:bad,b:1}], i%2===0);
    if(b.note) cells([{t:b.note,w:inner,c:mute,s:8}]);
  });
  foot();
  doc.save("ledger-"+today()+".pdf");
  flash("PDF downloaded.");
};
document.querySelectorAll(".bottom button, .side button").forEach(b=>b.onclick=()=>setTab(b.dataset.tab));
load(); render();
