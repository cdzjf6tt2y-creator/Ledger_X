<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1.0, viewport-fit=cover" />
  <title>Ledger</title>
  <link rel="preconnect" href="https://fonts.googleapis.com" />
  <link href="https://fonts.googleapis.com/css2?family=Nunito+Sans:opsz,wght@6..12,400;6..12,500;6..12,600;6..12,700&display=swap" rel="stylesheet" />
  <script src="https://cdn.jsdelivr.net/npm/chart.js@4.4.1/dist/chart.umd.min.js"></script>
  <script src="https://cdn.jsdelivr.net/npm/jspdf@2.5.1/dist/jspdf.umd.min.js"></script>
  <style>
    :root {
      --bg: #f6f3ee;
      --surface: #fcfbf8;
      --surface2: #efece6;
      --border: #e0dbd3;
      --fg: #2a2622;
      --muted: #5c564e;
      --good: #1d6b45;
      --bad: #a33d34;
      --warn: #8a6230;
      --soft: #efece6;
    }
    [data-theme="dark"] {
      --bg: #141311;
      --surface: #1c1b18;
      --surface2: #26241f;
      --border: #38352e;
      --fg: #f4f1ea;
      --muted: #c8c2b6;
      --good: #8dccaa;
      --bad: #e7a39b;
      --warn: #e0c08a;
      --soft: #26241f;
    }
    * { box-sizing: border-box; margin: 0; padding: 0; }
    body {
      font-family: "Nunito Sans", "Segoe UI", sans-serif;
      background: var(--bg);
      color: var(--fg);
      min-height: 100vh;
      font-size: 17px;
      line-height: 1.55;
      -webkit-font-smoothing: antialiased;
    }
    .app { max-width: 440px; margin: 0 auto; padding: 1.6rem 1.2rem 7.2rem; }
    .top { display: flex; justify-content: space-between; align-items: flex-start; gap: 0.8rem; margin-bottom: 1.5rem; }
    h1 { font-size: 2rem; font-weight: 650; letter-spacing: -0.02em; line-height: 1.15; }
    .sub { color: var(--muted); font-size: 0.98rem; margin-top: 0.25rem; max-width: 16rem; }
    .kicker { font-size: 0.95rem; color: var(--muted); }
    .actions { display: flex; gap: 0.4rem; }
    button { font-family: inherit; cursor: pointer; border: none; background: transparent; color: inherit; }
    .pill { height: 40px; padding: 0 0.95rem; border-radius: 999px; font-size: 0.95rem; font-weight: 600; border: 1px solid var(--border); background: var(--surface); }
    .pill.solid { background: var(--fg); color: var(--bg); border-color: var(--fg); }
    .hero { background: var(--surface); border: 1px solid var(--border); border-radius: 1.5rem; padding: 1.35rem; margin-bottom: 1.4rem; }
    .label { font-size: 0.95rem; color: var(--muted); }
    .net { font-size: 2.7rem; font-weight: 650; letter-spacing: -0.03em; line-height: 1.1; margin: 0.25rem 0 0.3rem; font-variant-numeric: tabular-nums; }
    .net.neg { color: var(--bad); }
    .meta-line { font-size: 0.95rem; color: var(--muted); }
    .grid2 { display: grid; grid-template-columns: 1fr 1fr; gap: 0.6rem; margin-top: 1rem; }
    .mini { background: var(--surface2); border-radius: 1rem; padding: 0.8rem 0.9rem; }
    .mini .l { font-size: 0.88rem; color: var(--muted); }
    .mini .v { font-size: 1.15rem; font-weight: 650; margin-top: 0.15rem; font-variant-numeric: tabular-nums; }
    .good { color: var(--good); } .bad { color: var(--bad); } .warn { color: var(--warn); }
    .section { margin-bottom: 1.5rem; }
    .section-head { display: flex; justify-content: space-between; align-items: center; margin-bottom: 0.65rem; }
    .section h2 { font-size: 1.28rem; font-weight: 650; }
    .card { background: var(--surface); border: 1px solid var(--border); border-radius: 1.25rem; padding: 1rem; }
    .item { display: flex; justify-content: space-between; align-items: center; gap: 0.7rem; padding: 0.75rem 0; border-bottom: 1px solid var(--border); }
    .item:last-child { border-bottom: none; }
    .name { font-weight: 650; }
    .meta { font-size: 0.92rem; color: var(--muted); margin-top: 0.1rem; }
    .empty { text-align: center; color: var(--muted); padding: 1.1rem 0.4rem; }
    .tabs { display: flex; background: var(--surface2); border-radius: 999px; padding: 0.2rem; margin-bottom: 1rem; }
    .tab { flex: 1; text-align: center; padding: 0.5rem 0.2rem; border-radius: 999px; font-size: 0.9rem; font-weight: 650; color: var(--muted); }
    .tab.on { background: var(--fg); color: var(--bg); }
    .bottom { position: fixed; left: 0; right: 0; bottom: 0; background: color-mix(in oklab, var(--bg) 92%, transparent); backdrop-filter: blur(16px); border-top: 1px solid var(--border); padding: 0.3rem 0.4rem calc(0.4rem + env(safe-area-inset-bottom)); }
    .bottom-inner { max-width: 440px; margin: 0 auto; display: flex; }
    .bottom button { flex: 1; min-height: 48px; font-size: 0.78rem; font-weight: 700; color: var(--muted); border-radius: 0.7rem; }
    .bottom button.on { color: var(--fg); }
    input, select { width: 100%; background: var(--surface2); border: 1px solid var(--border); color: var(--fg); padding: 0.7rem 0.8rem; border-radius: 0.75rem; font-size: 16px; font-family: inherit; margin-top: 0.2rem; }
    label { display: block; font-size: 0.92rem; color: var(--muted); margin-top: 0.7rem; }
    .modal { position: fixed; inset: 0; background: rgba(0,0,0,0.5); display: flex; align-items: flex-end; justify-content: center; z-index: 50; padding: 0.4rem; }
    .modal-box { background: var(--surface); border-radius: 1.25rem 1.25rem 0 0; padding: 1.15rem; width: 100%; max-width: 440px; max-height: 86vh; overflow-y: auto; }
    .progress { height: 6px; background: var(--surface2); border-radius: 99px; overflow: hidden; margin-top: 0.35rem; }
    .progress > div { height: 100%; background: var(--fg); }
    .chart-box { position: relative; height: 180px; margin-top: 0.35rem; }
    .link { color: var(--muted); font-size: 0.92rem; text-decoration: underline; }
    .danger { color: var(--bad); }
    .notice { display: none; margin-bottom: 1rem; padding: 0.7rem 0.9rem; background: var(--surface2); border-radius: 0.7rem; color: var(--warn); }
    .settled { opacity: 0.55; }
  </style>
</head>
<body>
  <div class="app">
    <div class="top">
      <div>
        <p class="kicker" id="monthLabel"></p>
        <h1>Ledger</h1>
        <p class="sub">Clear numbers. Easy to live with.</p>
      </div>
      <div class="actions">
        <button class="pill" id="themeBtn">Dark</button>
        <button class="pill solid" id="pdfBtn">PDF</button>
      </div>
    </div>
    <div class="notice" id="notice"></div>
    <div id="home" class="panel"></div>
    <div id="cash" class="panel" style="display:none"></div>
    <div id="banks" class="panel" style="display:none"></div>
    <div id="cards" class="panel" style="display:none"></div>
    <div id="book" class="panel" style="display:none"></div>
    <div id="charts" class="panel" style="display:none"></div>
    <div style="display:flex;gap:0.4rem;margin-top:1.4rem">
      <button class="pill" id="backupBtn">Backup</button>
      <button class="pill" id="importBtn">Import</button>
      <input type="file" id="importFile" accept=".json,application/json" style="display:none" />
    </div>
  </div>
  <nav class="bottom">
    <div class="bottom-inner">
      <button data-tab="home" class="on">Home</button>
      <button data-tab="cash">Cash</button>
      <button data-tab="banks">Banks</button>
      <button data-tab="charts">Charts</button>
      <button data-tab="cards">Cards</button>
      <button data-tab="book">Book</button>
    </div>
  </nav>
  <div id="modal" class="modal" style="display:none">
    <div class="modal-box">
      <h2 id="modalTitle" style="font-size:1.3rem;font-weight:700;margin-bottom:0.4rem"></h2>
      <div id="modalBody"></div>
      <div style="display:flex;justify-content:flex-end;gap:0.4rem;margin-top:1rem">
        <button class="pill" id="modalCancel">Cancel</button>
        <button class="pill solid" id="modalSave">Save</button>
      </div>
    </div>
  </div>
<script>
const { jsPDF } = window.jspdf;
const KEY = "ledger_premium_v1";
const THEME_KEY = "ledger_theme";
const CATS = ["Housing","Food","Transport","Utilities","Entertainment","Shopping","Health","Education","Travel","Subscriptions","Debt Payment","Other"];
const KINDS = [{id:"chequing",label:"Chequing"},{id:"savings",label:"Savings"},{id:"investment",label:"Investment"}];
let data = { income: [], expenses: [], budgets: {}, cards: [], accounts: [], goals: [], book: [] };
let theme = "dark";
let tab = "home";
let cashView = "expenses";
let bookView = "all";
let charts = {};
let modalSave = null;

function uid(){ return Date.now().toString(36)+Math.random().toString(36).slice(2,6); }
function esc(s){
  return String(s ?? "").replace(/[&<>"']/g, function(c){
    if (c === "&") return "&" + "amp;";
    if (c === "<") return "&" + "lt;";
    if (c === ">") return "&" + "gt;";
    if (c === '"') return "&" + "quot;";
    return "&" + "#39;";
  });
}
function today(){ return new Date().toISOString().slice(0,10); }
function monthKey(d){ const x=new Date(d+"T12:00:00"); return `${x.getFullYear()}-${String(x.getMonth()+1).padStart(2,"0")}`; }
function curMonth(){ const n=new Date(); return `${n.getFullYear()}-${String(n.getMonth()+1).padStart(2,"0")}`; }
function money(n){ return new Intl.NumberFormat("en-CA",{style:"currency",currency:"CAD"}).format(Number(n)||0); }
function interest(bal,apr){ return (bal*(apr/100))/12; }
function accrual(c){
  const balance=+c.balance||0, apr=+c.apr||0, todayStr=today();
  const asOf=(c.asOf&&/^\d{4}-\d{2}-\d{2}$/.test(c.asOf))?c.asOf:todayStr;
  const days=Math.max(0, Math.round((new Date(todayStr+"T12:00:00")-new Date(asOf+"T12:00:00"))/86400000));
  const daily=(balance*(apr/100))/365;
  return {asOf, days, daily, accrued:daily*days, owed:balance+daily*days};
}
function upsert(hist,date,bal){ const h=(hist||[]).filter(p=>p.date!==date); h.push({date,bal}); h.sort((a,b)=>a.date.localeCompare(b.date)); return h; }

function load(){
  try{
    const r=localStorage.getItem(KEY);
    if(r){
      const v=JSON.parse(r);
      if(Array.isArray(v.income)) data={...data,...v,accounts:v.accounts||[],goals:v.goals||[],book:Array.isArray(v.book)?v.book:[]};
    }
  }catch(e){}
  const todayStr=today();
  let stamped=false;
  data.cards=(data.cards||[]).map(c=>{ if(c.asOf) return c; stamped=true; return {...c, asOf:todayStr}; });
  data.book=(data.book||[]).map(b=>({...b, side:b.side==="me"?"me":"they", settled:!!b.settled}));
  if(stamped) localStorage.setItem(KEY, JSON.stringify(data));
  const t=localStorage.getItem(THEME_KEY); if(t==="dark"||t==="light") theme=t;
  applyTheme();
  document.getElementById("monthLabel").textContent = curMonth();
}
function applyTheme(){
  document.documentElement.dataset.theme = theme;
  document.getElementById("themeBtn").textContent = theme === "dark" ? "Light" : "Dark";
  localStorage.setItem(THEME_KEY, theme);
}
function save(){ localStorage.setItem(KEY, JSON.stringify(data)); render(); }
function flash(msg){ const n=document.getElementById("notice"); n.textContent=msg; n.style.display="block"; setTimeout(()=>n.style.display="none",2200); }
function stats(){
  const m=curMonth();
  const inc=data.income.filter(i=>monthKey(i.date)===m).reduce((s,i)=>s+ +i.amount,0);
  const exp=data.expenses.filter(e=>monthKey(e.date)===m).reduce((s,e)=>s+ +e.amount,0);
  const assets=data.accounts.reduce((s,a)=>s+ +a.balance,0);
  const debt=data.cards.reduce((s,c)=>s+accrual(c).owed,0);
  const accrued=data.cards.reduce((s,c)=>s+accrual(c).accrued,0);
  const int=data.cards.reduce((s,c)=>s+interest(+c.balance,+c.apr),0);
  const by={}; data.expenses.filter(e=>monthKey(e.date)===m).forEach(e=>by[e.category]=(by[e.category]||0)+ +e.amount);
  return {inc,exp,assets,debt,int,accrued,by,left:inc-exp,net:assets-debt,leak:inc-exp-int};
}

function render(){
  const s=stats();
  document.querySelectorAll(".panel").forEach(p=>p.style.display="none");
  document.getElementById(tab).style.display="block";
  document.querySelectorAll(".bottom button").forEach(b=>b.classList.toggle("on", b.dataset.tab===tab));
  if(tab==="home") renderHome(s);
  if(tab==="cash") renderCash();
  if(tab==="banks") renderBanks();
  if(tab==="cards") renderCards();
  if(tab==="book") renderBook();
  if(tab==="charts") renderCharts();
}

function renderHome(s){
  const monthRows=[...data.income.map(i=>({...i,k:"in"})),...data.expenses.map(e=>({...e,k:"out"}))].filter(r=>monthKey(r.date)===curMonth()).sort((a,b)=>b.date.localeCompare(a.date));
  const budgetCats=Object.keys(data.budgets||{});
  document.getElementById("home").innerHTML=`
    <div class="hero">
      <div class="label">Net worth</div>
      <div class="net ${s.net<0?"neg":""}">${money(s.net)}</div>
      <p class="meta-line">${money(s.assets)} in banks · ${money(s.debt)} owed on cards</p>
      <div class="grid2">
        <div class="mini"><div class="l">Income</div><div class="v good">${money(s.inc)}</div></div>
        <div class="mini"><div class="l">Spent</div><div class="v bad">${money(s.exp)}</div></div>
        <div class="mini"><div class="l">Interest / month</div><div class="v ${s.int>0?"bad":""}">${money(s.int)}</div></div>
        <div class="mini"><div class="l">${s.leak>=0?"Ahead this month":"Losing this month"}</div><div class="v ${s.leak>=0?"good":"bad"}">${money(s.leak)}</div></div>
      </div>
      <p class="meta-line" style="margin-top:0.75rem">${money(s.accrued)} already added since you logged the cards. The owed number grows by one day every calendar day.</p>
    </div>
    <div class="section"><h2>Income and spending</h2><p class="meta-line" style="margin-bottom:0.45rem">Last six months.</p><div class="card"><div class="chart-box"><canvas id="monthChartHome"></canvas></div></div></div>
    <div class="section"><h2>Net worth</h2><div class="card"><div class="chart-box"><canvas id="homeNet"></canvas></div></div></div>
    <div class="section">
      <div class="section-head"><h2>Accounts</h2><button class="link" onclick="setTab('banks')">Edit</button></div>
      <div class="card">${data.accounts.length? data.accounts.map(a=>`<div class="item"><div><div class="name">${esc(a.name)}</div><div class="meta">${KINDS.find(k=>k.id===a.kind)?.label||""}</div></div><div>${money(a.balance)}</div></div>`).join("") : `<div class="empty">Add a chequing, savings, or investment account.</div>`}</div>
    </div>
    <div class="section">
      <div class="section-head"><h2>Cards</h2><button class="link" onclick="setTab('cards')">Edit</button></div>
      <div class="card">${data.cards.length? data.cards.map(c=>{ const a=accrual(c); return `<div class="item" style="align-items:flex-start"><div><div class="name">${esc(c.name)}</div><div class="meta">${c.last4?"•••• "+esc(c.last4)+" · ":""}${c.apr}% · statement ${money(c.balance)} · +${money(a.accrued)} over ${a.days} day${a.days===1?"":"s"}</div></div><div class="bad">${money(a.owed)}</div></div>`; }).join("") : `<div class="empty">Add a card to see interest building.</div>`}</div>
    </div>
    <div class="section">
      <div class="section-head"><h2>Goals</h2><button class="link" onclick="openGoal()">Add</button></div>
      <div class="card">${data.goals.length? data.goals.map(g=>{ const pct=g.target>0?Math.min(100,(+g.saved/+g.target)*100):0; return `<div style="margin-bottom:0.9rem"><div style="display:flex;justify-content:space-between"><span class="name">${esc(g.name)}</span><span class="meta">${money(g.saved)} / ${money(g.target)}</span></div><div class="progress"><div style="width:${pct}%"></div></div>${g.note?`<div class="meta">${esc(g.note)}</div>`:""}<div style="margin-top:0.3rem"><button class="link" onclick="openGoal('${g.id}')">Edit</button> <button class="link danger" onclick="delGoal('${g.id}')">Delete</button></div></div>`; }).join("") : `<div class="empty">Set a goal and the progress bar will sit here.</div>`}</div>
    </div>
    <div class="section">
      <div class="section-head"><h2>Budgets</h2><button class="link" onclick="setCash('budgets')">Edit</button></div>
      <div class="card">${budgetCats.length? budgetCats.map(c=>{ const lim=+data.budgets[c]||0; const spent=s.by[c]||0; const pct=lim>0?Math.min(100,(spent/lim)*100):0; return `<div style="margin-bottom:0.85rem"><div style="display:flex;justify-content:space-between"><span>${esc(c)}</span><span class="meta">${money(spent)} / ${money(lim)}</span></div><div class="progress"><div style="width:${pct}%"></div></div></div>`; }).join("") : `<div class="empty">No budgets yet.</div>`}</div>
    </div>
    <div class="section">
      <div class="section-head"><h2>This month</h2><button class="link" onclick="setTab('cash')">Edit</button></div>
      <div class="card">${monthRows.length? monthRows.map(r=>`<div class="item"><div><div class="name">${esc(r.description|| (r.k==="in"?"Income":r.category))}</div><div class="meta">${r.date}${r.k==="out"?" · "+esc(r.category):""}</div></div><div class="${r.k==="in"?"good":"bad"}">${r.k==="in"?"+":"−"}${money(r.amount)}</div></div>`).join("") : `<div class="empty">Nothing logged this month.</div>`}</div>
    </div>`;
  drawMonth("monthChartHome");
  drawNet("homeNet");
}

function renderCash(){
  document.getElementById("cash").innerHTML=`
    <div class="tabs">
      <button class="tab ${cashView==="expenses"?"on":""}" onclick="setCash('expenses')">Spent</button>
      <button class="tab ${cashView==="income"?"on":""}" onclick="setCash('income')">Income</button>
      <button class="tab ${cashView==="budgets"?"on":""}" onclick="setCash('budgets')">Budgets</button>
    </div>
    <div class="section-head"><h2>${cashView==="expenses"?"Spent":cashView==="income"?"Income":"Budgets"}</h2><button class="pill solid" onclick="${cashView==="budgets"?"openBudget()":cashView==="income"?"openIncome()":"openExpense()"}">Add</button></div>
    <div class="card" id="cashList"></div>`;
  const box=document.getElementById("cashList");
  if(cashView==="income"){
    const rows=[...data.income].sort((a,b)=>b.date.localeCompare(a.date));
    box.innerHTML=rows.length? rows.map(r=>`<div class="item"><div><div class="name">${esc(r.description||"Income")}</div><div class="meta">${r.date}</div></div><div style="text-align:right"><div class="good">+${money(r.amount)}</div><button class="link" onclick="openIncome('${r.id}')">Edit</button> <button class="link danger" onclick="delIncome('${r.id}')">Delete</button></div></div>`).join("") : `<div class="empty">No income yet.</div>`;
  } else if(cashView==="expenses"){
    const rows=[...data.expenses].sort((a,b)=>b.date.localeCompare(a.date));
    box.innerHTML=rows.length? rows.map(r=>`<div class="item"><div><div class="name">${esc(r.description||r.category)}</div><div class="meta">${r.date} · ${esc(r.category)}</div></div><div style="text-align:right"><div class="bad">−${money(r.amount)}</div><button class="link" onclick="openExpense('${r.id}')">Edit</button> <button class="link danger" onclick="delExpense('${r.id}')">Delete</button></div></div>`).join("") : `<div class="empty">No spending yet.</div>`;
  } else {
    const cats=Object.keys(data.budgets||{});
    box.innerHTML=cats.length? cats.map(c=>{ const lim=+data.budgets[c]||0; const spent=stats().by[c]||0; return `<div class="item"><div><div class="name">${esc(c)}</div><div class="meta">${money(spent)} of ${money(lim)}</div></div><div><button class="link" onclick="openBudget('${c.replace(/'/g,"\\'")}')">Edit</button> <button class="link danger" onclick="delBudget('${c.replace(/'/g,"\\'")}')">Delete</button></div></div>`; }).join("") : `<div class="empty">No budgets yet.</div>`;
  }
}

function renderBanks(){
  document.getElementById("banks").innerHTML=`
    <div class="section">
      <div class="section-head"><h2>Banks</h2><button class="pill solid" onclick="openAccount()">Add</button></div>
      <p class="meta-line" style="margin-bottom:0.7rem">Chequing, savings, investments. Log the balance when it changes.</p>
      ${data.accounts.length? data.accounts.map(a=>`
        <div class="card" style="margin-bottom:0.55rem">
          <div style="display:flex;justify-content:space-between;align-items:center">
            <div><div class="meta">${KINDS.find(k=>k.id===a.kind)?.label||""}</div><div class="name">${esc(a.name)}</div></div>
            <div style="font-size:1.25rem;font-weight:700">${money(a.balance)}</div>
          </div>
          <div style="margin-top:0.55rem;display:flex;gap:0.7rem">
            <button class="link" onclick="openLog('${a.id}')">Log</button>
            <button class="link" onclick="openAccount('${a.id}')">Edit</button>
            <button class="link danger" onclick="delAccount('${a.id}')">Delete</button>
          </div>
        </div>`).join("") : `<div class="card"><div class="empty">No accounts yet.</div></div>`}
    </div>`;
}

function renderCards(){
  document.getElementById("cards").innerHTML=`
    <div class="section">
      <div class="section-head"><h2>Cards</h2><button class="pill solid" onclick="openCard()">Add</button></div>
      ${data.cards.length? data.cards.map(c=>{
        const a=accrual(c);
        return `<div class="card" style="margin-bottom:0.55rem">
          <div style="display:flex;justify-content:space-between;align-items:center">
            <div><div class="name">${esc(c.name)}</div><div class="meta">${c.last4?"•••• "+esc(c.last4)+" · ":""}${c.apr}% APR</div></div>
            <div style="text-align:right"><div class="bad" style="font-size:1.25rem;font-weight:700">${money(a.owed)}</div><div class="meta">owed now</div></div>
          </div>
          <p class="meta" style="margin-top:0.45rem">Statement ${money(c.balance)} on ${a.asOf}. Added ${money(a.accrued)} over ${a.days} day${a.days===1?"":"s"} at ${money(a.daily)} a day.</p>
          <div style="margin-top:0.45rem"><button class="link" onclick="openCard('${c.id}')">Edit</button> <button class="link danger" onclick="delCard('${c.id}')">Delete</button></div>
        </div>`;
      }).join("") : `<div class="card"><div class="empty">No cards yet.</div></div>`}
    </div>`;
}

function renderBook(){
  const open=data.book.filter(b=>!b.settled);
  const they=open.filter(b=>b.side==="they").reduce((s,b)=>s+ +b.amount,0);
  const me=open.filter(b=>b.side==="me").reduce((s,b)=>s+ +b.amount,0);
  const rows=data.book.filter(b=>bookView==="all"||b.side===bookView);
  document.getElementById("book").innerHTML=`
    <div class="section">
      <div class="section-head"><h2>Book</h2><button class="pill solid" onclick="openBook()">Add</button></div>
      <p class="meta-line" style="margin-bottom:0.75rem">People who owe you, and people you owe. This stays off Home.</p>
      <div class="grid2" style="margin-top:0;margin-bottom:0.8rem">
        <div class="mini"><div class="l">They owe you</div><div class="v good">${money(they)}</div></div>
        <div class="mini"><div class="l">You owe</div><div class="v bad">${money(me)}</div></div>
      </div>
      <div class="tabs">
        <button class="tab ${bookView==="all"?"on":""}" onclick="setBook('all')">All</button>
        <button class="tab ${bookView==="they"?"on":""}" onclick="setBook('they')">Owe you</button>
        <button class="tab ${bookView==="me"?"on":""}" onclick="setBook('me')">You owe</button>
      </div>
      ${rows.length? rows.map(b=>`
        <div class="card ${b.settled?"settled":""}" style="margin-bottom:0.55rem">
          <div style="display:flex;justify-content:space-between;gap:0.6rem">
            <div><div class="name">${esc(b.name)}</div><div class="meta">${b.side==="they"?"Owes you":"You owe them"} · ${esc(b.date)}${b.settled?" · Settled":""}</div>${b.note?`<div class="meta">${esc(b.note)}</div>`:""}</div>
            <div class="${b.side==="they"?"good":"bad"}" style="font-weight:700">${money(b.amount)}</div>
          </div>
          <div style="margin-top:0.5rem;display:flex;gap:0.7rem;flex-wrap:wrap">
            <button class="link" onclick="toggleBook('${b.id}')">${b.settled?"Reopen":"Mark settled"}</button>
            <button class="link" onclick="openBook('${b.id}')">Edit</button>
            <button class="link danger" onclick="delBook('${b.id}')">Delete</button>
          </div>
        </div>`).join("") : `<div class="card"><div class="empty">Nothing written down yet.</div></div>`}
    </div>`;
}

function renderCharts(){
  document.getElementById("charts").innerHTML=`
    <div class="section"><h2>Six months</h2><div class="card"><div class="chart-box"><canvas id="monthChart"></canvas></div></div></div>
    <div class="section"><h2>Spending</h2><div class="card"><div class="chart-box"><canvas id="catChart"></canvas></div></div></div>
    <div class="section"><h2>Net worth</h2><div class="card"><div class="chart-box"><canvas id="netChart"></canvas></div></div></div>`;
  drawMonth("monthChart"); drawCat(); drawNet("netChart");
}

function setTab(t){ tab=t; render(); }
function setCash(v){ cashView=v; tab="cash"; render(); }
function setBook(v){ bookView=v; tab="book"; render(); }

function openModal(title, html, onSave){
  document.getElementById("modalTitle").textContent=title;
  document.getElementById("modalBody").innerHTML=html;
  document.getElementById("modal").style.display="flex";
  modalSave=onSave;
}
document.getElementById("modalCancel").onclick=()=>{ document.getElementById("modal").style.display="none"; modalSave=null; };
document.getElementById("modalSave").onclick=()=>{ if(modalSave && modalSave()===false) return; document.getElementById("modal").style.display="none"; modalSave=null; };

function monthSeries(){
  const rows=[];
  const now=new Date();
  for(let i=5;i>=0;i--){
    const d=new Date(now.getFullYear(), now.getMonth()-i, 1);
    const key=`${d.getFullYear()}-${String(d.getMonth()+1).padStart(2,"0")}`;
    rows.push({
      name:d.toLocaleString("en-CA",{month:"short"}),
      Income:data.income.filter(x=>monthKey(x.date)===key).reduce((s,x)=>s+ +x.amount,0),
      Spent:data.expenses.filter(x=>monthKey(x.date)===key).reduce((s,x)=>s+ +x.amount,0)
    });
  }
  return rows;
}
function netSeries(){
  const dates=new Set();
  data.accounts.forEach(a=>(a.history||[]).forEach(p=>dates.add(p.date)));
  const debt=data.cards.reduce((s,c)=>s+accrual(c).owed,0);
  return [...dates].sort().map(d=>{
    let assets=0;
    data.accounts.forEach(a=>{
      const prior=[...(a.history||[])].filter(p=>p.date<=d).at(-1);
      if(prior) assets+= +prior.bal;
    });
    return {date:d.slice(5), net:Math.round(assets-debt)};
  });
}
function drawNet(id){
  const ctx=document.getElementById(id); if(!ctx) return;
  if(charts[id]) charts[id].destroy();
  const series=netSeries();
  if(!series.length){ ctx.parentElement.innerHTML=`<div class="empty">Log an account balance to see this.</div>`; return; }
  const accent = theme==="dark" ? "#f4f1ea" : "#2a2622";
  charts[id]=new Chart(ctx,{type:"line",data:{labels:series.map(s=>s.date),datasets:[{data:series.map(s=>s.net),borderColor:accent,backgroundColor:"transparent",tension:0.35,pointRadius:0,borderWidth:2}]},options:{responsive:true,maintainAspectRatio:false,plugins:{legend:{display:false}},scales:{x:{grid:{display:false},ticks:{color:"#8a847a",font:{family:"Nunito Sans",size:11}}},y:{grid:{color:theme==="dark"?"rgba(255,255,255,0.06)":"rgba(0,0,0,0.06)"},ticks:{color:"#8a847a",font:{family:"Nunito Sans",size:11}}}}}});
}
function drawMonth(id){
  const ctx=document.getElementById(id); if(!ctx) return;
  if(charts[id]) charts[id].destroy();
  const rows=monthSeries();
  const good = theme==="dark" ? "#8dccaa" : "#1d6b45";
  const bad = theme==="dark" ? "#e7a39b" : "#a33d34";
  const grid = theme==="dark" ? "#38352e" : "#e0dbd3";
  charts[id]=new Chart(ctx,{type:"bar",data:{labels:rows.map(r=>r.name),datasets:[{label:"Income",data:rows.map(r=>r.Income),backgroundColor:good,borderRadius:6},{label:"Spent",data:rows.map(r=>r.Spent),backgroundColor:bad,borderRadius:6}]},options:{responsive:true,maintainAspectRatio:false,plugins:{legend:{position:"bottom",labels:{color:"#8a847a",font:{family:"Nunito Sans",size:12}}}},scales:{x:{grid:{display:false},ticks:{color:"#8a847a",font:{family:"Nunito Sans",size:11}}},y:{grid:{color:grid},ticks:{color:"#8a847a",font:{family:"Nunito Sans",size:11}}}}}});
}
function drawCat(){
  const ctx=document.getElementById("catChart"); if(!ctx) return;
  if(charts.catChart) charts.catChart.destroy();
  const s=stats(); const labels=Object.keys(s.by); const vals=Object.values(s.by);
  if(!labels.length){ ctx.parentElement.innerHTML=`<div class="empty">No spending this month.</div>`; return; }
  charts.catChart=new Chart(ctx,{type:"bar",data:{labels,datasets:[{data:vals,backgroundColor:theme==="dark"?"#e7a39b":"#a33d34",borderRadius:6}]},options:{indexAxis:"y",responsive:true,maintainAspectRatio:false,plugins:{legend:{display:false}},scales:{x:{grid:{color:theme==="dark"?"rgba(255,255,255,0.06)":"rgba(0,0,0,0.06)"},ticks:{color:"#8a847a",font:{family:"Nunito Sans",size:11}}},y:{grid:{display:false},ticks:{color:"#8a847a",font:{family:"Nunito Sans",size:11}}}}}});
}

document.getElementById("themeBtn").onclick=()=>{ theme = theme === "dark" ? "light" : "dark"; applyTheme(); render(); };
document.getElementById("backupBtn").onclick=()=>{
  const blob=new Blob([JSON.stringify(data,null,2)],{type:"application/json"});
  const a=document.createElement("a"); a.href=URL.createObjectURL(blob); a.download=`ledger-backup-${today()}.json`; a.click();
};
document.getElementById("importBtn").onclick=()=>document.getElementById("importFile").click();
document.getElementById("importFile").onchange=(e)=>{
  const f=e.target.files&&e.target.files[0]; if(!f) return;
  const r=new FileReader();
  r.onload=()=>{
    try{
      const v=JSON.parse(r.result);
      if(!Array.isArray(v.income)) throw 0;
      if(!confirm("Replace everything?")) return;
      data={...data,...v,accounts:v.accounts||[],goals:v.goals||[],book:Array.isArray(v.book)?v.book:[]};
      save(); flash("Imported.");
    }catch{ flash("Invalid file."); }
  };
  r.readAsText(f); e.target.value="";
};
document.getElementById("pdfBtn").onclick=()=>{
  const doc=new jsPDF({unit:"mm",format:"a4"});
  const s=stats();
  let y=18;
  const line=(text,size=11,bold=false)=>{
    if(y>275){ doc.addPage(); y=18; }
    doc.setFont("helvetica", bold?"bold":"normal");
    doc.setFontSize(size);
    doc.setTextColor(42,38,34);
    const lines=doc.splitTextToSize(text,180);
    doc.text(lines,15,y);
    y += lines.length * (size * 0.45) + 2.4;
  };
  line("Ledger", 20, true);
  line(`${curMonth()} · ${today()}`, 10);
  y += 2;
  line(`Net worth  ${money(s.net)}`, 12, true);
  line(`Assets ${money(s.assets)}   Cards ${money(s.debt)}`);
  line(`Left this month  ${money(s.left)}`);
  line(`After interest  ${money(s.leak)}`);
  y += 2;
  line("Accounts", 13, true);
  if(!data.accounts.length) line("None.");
  data.accounts.forEach(a=>line(`${a.name} (${a.kind})   ${money(a.balance)}`));
  y += 2;
  line("Goals", 13, true);
  if(!data.goals.length) line("None.");
  data.goals.forEach(g=>line(`${g.name}   ${money(g.saved)} of ${money(g.target)}`));
  y += 2;
  line("Income this month", 13, true);
  const inc=data.income.filter(i=>monthKey(i.date)===curMonth());
  if(!inc.length) line("None.");
  inc.forEach(i=>line(`${i.date}   ${i.description||"Income"}   ${money(i.amount)}`));
  y += 2;
  line("Expenses this month", 13, true);
  const exp=data.expenses.filter(e=>monthKey(e.date)===curMonth());
  if(!exp.length) line("None.");
  exp.forEach(e=>line(`${e.date}   ${e.category}   ${e.description||""}   ${money(e.amount)}`));
  y += 2;
  line("Credit cards", 13, true);
  if(!data.cards.length) line("None.");
  data.cards.forEach(c=>{ const a=accrual(c); line(`${c.name}   statement ${money(c.balance)}   owed now ${money(a.owed)}   ${c.apr}%`); });
  y += 2;
  line("Book", 13, true);
  const openBook=data.book.filter(b=>!b.settled);
  if(!openBook.length) line("None open.");
  openBook.forEach(b=>line(`${b.date}   ${b.name}   ${b.side==="they"?"owes you":"you owe"}   ${money(b.amount)}${b.note?"   "+b.note:""}`));
  y += 3;
  line("Card interest is simple daily: balance x APR / 365. The book is not part of net worth.", 9);
  doc.save(`ledger-${today()}.pdf`);
  flash("PDF downloaded.");
};
document.querySelectorAll(".bottom button").forEach(b=>b.onclick=()=>setTab(b.dataset.tab));
load(); render();
